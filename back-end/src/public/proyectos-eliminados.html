<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="icon" type="image/svg+xml" href="img/Favicon.svg">
  <title>Proyectos Eliminados</title>
  <link rel="stylesheet" href="css/proyectos-eliminados.css" />
</head>
<body>
  <header class="header">
    <div class="btns-izqsup">
    <button id="toggleSidebar" class="toggle-sidebar">☰</button>
    <button id="btn-volver" class="btn-volver"><img src="img/icons8-home.svg" alt="←"></button>
    </div>
    <h1>  Proyectos Eliminados</h1>
            <!-- Logo centrado en la barra -->
        <div class="logo-container">
            <a>
               
                <img src="img/logoescuela.png" alt="Universidad Tecnológica de Tamaulipas Norte">
            </a>
        </div>
        
        <!-- Espaciador para equilibrar el diseño -->
        <div style="flex-shrink: 0; width: 100px;"></div>

  <main>

    <aside class="sidebar">

      <ul id="lista-departamentos">
        <!-- Botones dinámicos serán insertados aquí por JS (si decides usarlo también aquí) -->
      </ul>

    <!-- Contenedor de proyectos eliminados -->
    <section class="contenido">
      <div id="proyectosEliminadosContainer">
        <!-- ⚠️ Cambiado de id="proyectosEliminadosContainer" a id="proyectosContainer" para que coincida con JS -->
      </div>
    </section>
  </main>

  <!-- ✅ Solo se necesita un script, no ambos -->
  <script src="js/proyectos-eliminados.js" type="module"></script>
