<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="img/svg+xml" href="img/Favicon.svg">
  <title>Panel Usuario - Gestión de Proyectos</title>
  <link rel="stylesheet" href="css/usuario.css" />
</head>
<body>
  <!-- BARRA SUPERIOR -->
  <header class="header">
    <button id="toggleSidebar">☰</button>
    <h1 class="titulo1">Gestión de Proyectos - Usuario</h1>
     <!-- Logo centrado en la barra -->
        <div class="logo-container">
            <a>
               
                <img src="https://www.uttn.edu.mx/wp-content/uploads/2017/06/logo-UT-Tamaulipas-Norte.png" alt="Universidad Tecnológica de Tamaulipas Norte">
            </a>
        </div>
        
        <!-- Espaciador para equilibrar el diseño -->
        <div style="flex-shrink: 0; width: 100px;"></div>
    <div class="acciones-superior">
      <span id="bienvenida"></span>
      <button id="logoutBtn">Cerrar sesión</button>
    </div>
  </header>

  <div class="contenedor-principal">
    <!-- SIDEBAR -->
    <aside class="sidebar">
      <h2>Departamentos</h2>
      <ul id="lista-departamentos">
        <!-- Botones dinámicos por departamento -->
      </ul>
    </aside>

    <!-- CONTENIDO PRINCIPAL -->
    <main class="contenido">
      <div class="barra-controles">
        <button id="btnNuevoProyecto">+ Nuevo Proyecto</button>
        <button id="btnVerEliminados">Ver Eliminados</button>
        <button id="btnVista">Cambiar Vista</button>
      </div>

      <section id="proyectosContainer" class="vista-tarjeta">
        <!-- Aquí se renderizan los proyectos -->
      </section>
    </main>
  </div>

  <script type="module" src="js/usuario.js"></script>
</body>
</html>
