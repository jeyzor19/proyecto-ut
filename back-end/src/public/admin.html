<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="img/svg+xml" href="img/Favicon.svg">
    <title>Panel Admin - Gestión de Proyectos</title>
    <link rel="stylesheet" href="css/admin.css" />
</head>
<body>
    <!-- BARRA SUPERIOR -->
    <header class="header">
        <button id="toggleSidebar">☰</button>
        <h1 class="titulo">Gestión de Proyectos - Admin</h1>
        <div class="acciones-superior">
        <span id="bienvenida"></span>
        <button id="logoutBtn">Cerrar sesión</button>
        </div>
    </header>

    <div class="contenedor-principal">
        <!-- SIDEBAR -->
        <aside class="sidebar">
        <h2>Departamentos</h2>
        <ul id="lista-departamentos">
            <!-- Botones dinámicos por departamento -->
        </ul>
        </aside>

        <!-- CONTENIDO PRINCIPAL -->
        <main class="contenido">
        <div class="barra-controles">
            <button id="btnNuevoProyecto">+ Nuevo Proyecto</button>
            <button id="btnVerEliminados">Ver Eliminados</button>
            <button id="btnVista">Cambiar Vista</button>
        </div>

        <section id="proyectosContainer" class="vista-tarjeta">
            <!-- Aquí se renderizan los proyectos -->
            <div class="tarjeta-proyecto">
                
        </section>
        </main>
    </div>

    <!-- Modal: Agregar Bitácora -->
        <div id="modal-bitacora" class="modal hidden" aria-hidden="true">
        <div class="modal-backdrop" data-close-modal></div>
        <div class="modal-content" role="dialog" aria-modal="true" aria-labelledby="bitacoraTitleLabel">
            <header class="modal-header">
            <h3 id="bitacoraTitleLabel">Agregar bitácora</h3>
            <button class="modal-close" title="Cerrar" data-close-modal>&times;</button>
            </header>
            <section class="modal-body">
            <label>
                Título (opcional)
                <input id="bitacoraTitulo" type="text" maxlength="250" />
            </label>
            <label style="display:block;margin-top:8px;">
                Comentario <span style="color:#c00">*</span>
                <textarea id="bitacoraComentario" rows="5" placeholder="Escribe tu comentario. Puedes firmar al final si deseas." required></textarea>
            </label>
            </section>
            <footer class="modal-footer">
            <button id="bitacoraCancelar" data-close-modal>Cancelar</button>
            <button id="bitacoraGuardar">Guardar</button>
            </footer>
        </div>
        </div>

        <!-- Modal: Ver Bitácoras -->
        <div id="modal-bitacoras" class="modal hidden" aria-hidden="true">
            <div class="modal-backdrop" data-close-modal></div>
            <div class="modal-content" role="dialog" aria-modal="true" aria-labelledby="bitacorasTitleLabel">
                <header class="modal-header">
                <h3 id="bitacorasTitleLabel">Bitácoras del proyecto</h3>
                <button class="modal-close" title="Cerrar" data-close-modal>&times;</button>
                </header>
                <section class="modal-body">
                <div id="bitacorasLista" class="bitacoras-lista">Cargando…</div>
                </section>
                <footer class="modal-footer">
                <button data-close-modal>Cerrar</button>
                </footer>
            </div>
        </div>


<script type="module" src="js/admin.js"></script>

    <script type="module" src="js/admin.js"></script>
</body>
</html>
